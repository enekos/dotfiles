# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  NERV TERMINAL — Evangelion Dark starship prompt                          ║
# ║  Themed to match ~/dotfiles/nvim evangelion-dark.lua + the iTerm2 preset. ║
# ║  Stack-aware: Rust · Go · Node(fnm) · Python(uv) · Docker · k8s · gcloud. ║
# ║  Full docs: ~/dotfiles/starship/README.md                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true          # breathing room above each prompt
command_timeout = 1300      # gcloud/kubectl can be slow; don't warn at 500ms
palette = "evangelion"

# ── Prompt layout ───────────────────────────────────────────────────────────
# NOTE: top-level `format`/`right_format` MUST sit above the [palettes.*] table
# below — in TOML a bare key after a [table] header is parsed INTO that table.
# Line 1: floating "pills". Each module is a self-contained rounded segment
#   [](color) [ content ](fg bg) [](color)
# so a missing module (e.g. no Rust here) never breaks the color chain — the
# classic powerline fragility. Only relevant segments render.
# Line 2: the ❯ character — green on success, red klaxon on failure.
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$rust\
$golang\
$nodejs\
$bun\
$python\
$docker_context\
$kubernetes\
$gcloud\
$line_break\
$character"""

# Right side: how long the last command took · background jobs · clock.
right_format = """
$cmd_duration\
$jobs\
$time"""

# ── NERV palette ────────────────────────────────────────────────────────────
# Lifted straight from evangelion-dark.lua so prompt == editor == terminal.
[palettes.evangelion]
eva_purple    = "#a78bfa"   # EVA-01 — the "you are here" accent
eva_purple_d  = "#8b5cf6"
nerv_green    = "#39ff14"   # MAGI phosphor green
nerv_green_s  = "#7aff5e"
amber         = "#fbbf24"   # AT-field / caution
amber_l       = "#fcd34d"
alert_red     = "#ef4444"   # klaxon / berserk
alert_red_l   = "#f87171"
lcl_cyan      = "#22d3ee"   # LCL / hologram blue
lcl_cyan_l    = "#67e8f9"
fg            = "#f5f5ff"
fg_dim        = "#e2e2f0"
muted         = "#5a5a80"
muted_l       = "#9a9ab0"
surface       = "#2a2a40"   # segment fill
surface_d     = "#16162a"
bg            = "#12121f"    # near-black background
bg_d          = "#0d0d18"    # dark text sitting ON bright pills

# ── SSH identity (only shows on remote boxes) ───────────────────────────────
[username]
show_always = false
style_user = "bg:surface fg:amber_l"
style_root = "bg:surface fg:alert_red"
format = "[](fg:surface)[ $user](bg:surface fg:amber_l)"

[hostname]
ssh_only = true
format = "[@$hostname ](bg:surface fg:amber_l)[](fg:surface) "
trim_at = "."

# ── Where am I ──────────────────────────────────────────────────────────────
[directory]
truncation_length = 3
truncate_to_repo = true
read_only = "  "
read_only_style = "bg:eva_purple_d fg:alert_red"
home_symbol = " "
format = "[](fg:eva_purple_d)[ $path ]($style)[$read_only]($read_only_style)[](fg:eva_purple_d) "
style = "bg:eva_purple_d fg:bg_d bold"

# Prettier names for the roots you live in.
[directory.substitutions]
"~/src/meta" = " meta"
"~/eneko_projects" = " projects"
"~/thinking-os" = " thinking-os"
"Documents" = " docs"

# ── Git ─────────────────────────────────────────────────────────────────────
# Branch + in-flight state (rebase/merge/cherry-pick) live in one green pill…
[git_branch]
symbol = " "
format = "[](fg:surface)[ $symbol$branch ](fg:nerv_green_s bg:surface)"
style = "bg:surface"

[git_state]
format = "[$state( $progress_current/$progress_total) ](fg:amber_l bg:surface)"

# …and dirty-state flags close out the same pill (no gap between them).
[git_status]
format = "[$all_status$ahead_behind](fg:amber_l bg:surface)[](fg:surface) "
conflicted = "⚔ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "? "
stashed = " "
modified = "● "
staged = "✚ "
renamed = "» "
deleted = "✘ "

# Lines added/removed since HEAD — the "impact meter".
[git_metrics]
disabled = false
added_style = "fg:nerv_green"
deleted_style = "fg:alert_red_l"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# ── Language pills (auto-detected — only appear inside a matching project) ───
[rust]
symbol = " "
format = "[](fg:alert_red)[ $symbol$version ](fg:bg_d bg:alert_red)[](fg:alert_red) "

[golang]
symbol = " "
format = "[](fg:lcl_cyan)[ $symbol$version ](fg:bg_d bg:lcl_cyan)[](fg:lcl_cyan) "

[nodejs]
symbol = " "
format = "[](fg:nerv_green)[ $symbol$version ](fg:bg_d bg:nerv_green)[](fg:nerv_green) "
detect_files = ["package.json", ".nvmrc", ".node-version"]

[bun]
symbol = "🥟 "
format = "[](fg:fg_dim)[ $symbol$version ](fg:bg_d bg:fg_dim)[](fg:fg_dim) "

[python]
symbol = " "
format = "[](fg:amber)[ $symbol$version( $virtualenv) ](fg:bg_d bg:amber)[](fg:amber) "

# ── Ops context ─────────────────────────────────────────────────────────────
[docker_context]
symbol = " "
only_with_files = true                 # hide unless a Dockerfile/compose is near
format = "[](fg:lcl_cyan_l)[ $symbol$context ](fg:bg_d bg:lcl_cyan_l)[](fg:lcl_cyan_l) "

# Kubernetes — a red klaxon pill, because knowing your context prevents accidents.
# Scoped to infra dirs so it stays quiet while you're just coding. To make it
# ALWAYS show, delete the detect_* lines below.
[kubernetes]
disabled = false
symbol = "☸ "
format = "[](fg:alert_red_l)[ $symbol$context(/$namespace) ](fg:bg_d bg:alert_red_l bold)[](fg:alert_red_l) "
detect_files = ["Dockerfile", "skaffold.yaml", "Chart.yaml", "kustomization.yaml"]
detect_folders = ["k8s", "kubernetes", "helm", "charts", ".helm"]
detect_extensions = ["tf"]
[kubernetes.context_aliases]
"gke_.*_(?P<var_cluster>[\\w-]+)" = "$var_cluster"   # trim verbose GKE names

# gcloud — the active GCP project (you're a GCP shop / on backend rotation).
# Compact: project id only. See README to scope or silence it.
[gcloud]
symbol = "☁ "
format = "[](fg:amber_l)[ $symbol$project ](fg:bg_d bg:amber_l)[](fg:amber_l) "

# ── Right side ──────────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2000                        # only surface commands slower than 2s
format = "[  $duration ](fg:amber)"

[jobs]
symbol = " "
format = "[$symbol$number ](fg:eva_purple)"

[time]
disabled = false
time_format = "%H:%M"
format = "[  $time ](fg:muted)"

# ── The character ───────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold nerv_green)"
error_symbol = "[❯](bold alert_red)"
vimcmd_symbol = "[❮](bold amber)"
vimcmd_replace_symbol = "[❮](bold eva_purple)"
vimcmd_visual_symbol = "[❮](bold lcl_cyan)"
